[package]
name = "agentarc"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
description = "Archive AI-agent session files and compute trustworthy token/cost statistics"
license = "MIT"
repository = "https://github.com/dingzy53/AgentArc"
authors = ["Ding Zheng Yuan <dingzhengyuan53@gmail.com>"]
readme = "README.md"
keywords = ["ai", "archive", "cli", "statistics", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
jiff = "0.2.41"
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = "3.5.1"
walkdir = "2.5.0"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
